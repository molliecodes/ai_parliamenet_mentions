name: Update AI mentions

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch recent mentions
        run: |
          python cli.py fetch \
            --start "$(date -u -d '7 days ago' +%Y-%m-%d)" \
            --end "$(date -u +%Y-%m-%d)"

      - name: Apply known false-positive exclusions
        run: python cli.py filter

      - name: Export dashboard data
        run: python cli.py export

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai_mentions.db docs/data/mentions.json docs/data/mentions.csv
          git diff --staged --quiet || git commit -m "Automated data update"
          git push
