<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK Parliament AI Mention Tracker</title>
  <style>
    /* Structural only — iframe-friendliness (fluid width, no fixed height
       assumptions). Visual polish is a Phase 4 concern. */
    html, body { margin: 0; padding: 0; width: 100%; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; }
  </style>
</head>
<body>
  <h1>UK Parliament AI Mention Tracker</h1>
  <p id="count">Loading…</p>
  <table id="mentions">
    <thead>
      <tr>
        <th>Date</th>
        <th>House</th>
        <th>Speaker</th>
        <th>Party</th>
        <th>Debate</th>
        <th>Mention</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
