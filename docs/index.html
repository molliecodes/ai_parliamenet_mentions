<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK Parliament AI Mention Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>UK Parliament AI Mention Tracker</h1>
  <p id="count">Loading…</p>

  <div id="chart-container">
    <svg id="chart" role="img" aria-label="Mentions of AI per month"></svg>
  </div>

  <div id="rankings">
    <div class="ranking-panel">
      <h2>Who mentions AI most</h2>
      <ol id="top-speakers"></ol>
    </div>
    <div class="ranking-panel">
      <h2>By party</h2>
      <div id="party-ranking"></div>
    </div>
  </div>

  <div id="filters">
    <label>
      House
      <select id="filter-house">
        <option value="">All</option>
        <option value="Commons">Commons</option>
        <option value="Lords">Lords</option>
      </select>
    </label>
    <label>
      Party
      <select id="filter-party">
        <option value="">All</option>
      </select>
    </label>
    <label>
      Speaker
      <input type="text" id="filter-speaker" placeholder="Search by name…">
    </label>
  </div>

  <table id="mentions">
    <thead>
      <tr>
        <th>Date</th>
        <th>House</th>
        <th>Speaker</th>
        <th>Party</th>
        <th>Debate</th>
        <th>Mention</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
